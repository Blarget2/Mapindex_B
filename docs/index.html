<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sMaptic - Map Index</title>
  <link rel="icon" href="mod_icon.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <script src="jszip.min.js"></script>
</head>

<body>
  <header class="page-header">
    <img src="mod_icon.png" alt="Mod icon" class="mod-icon">
    <h1>sMaptic - Template</h1>
    <a class="back-link" href="https://smaptic.github.io/">Back to homepage</a>
  </header>

  <input id="search" type="search" placeholder="Search maps..." aria-label="Search maps">
  <div class="page-scroll">
    <p id="status"></p>
    <ul id="maps"></ul>
  </div>

  <footer class="page-footer">
    <a href="https://github.com/sMaptic/MapIndex">Source</a>
    <p>made with ❤ by <a href="https://github.com/theidiotcreature/">@theidiotcreature</a></p>
    <button id="theme-toggle" type="button" aria-label="Toggle dark mode">
      <span>☾</span>
    </button>
  </footer>

  <script src="script.js"></script>
</body>
</html>
